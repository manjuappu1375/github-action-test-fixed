name: Sync config dropdown

on:
  push:
    branches: [ '**' ]
    paths:
      - 'configs/**.yaml'
      - 'configs/**.yml'
  workflow_dispatch:

concurrency:
  group: sync-config-dropdown
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync config environments
        env:
          CONFIG_SYNC_TOKEN: ${{ secrets.CONFIG_SYNC_TOKEN }}
        run: python3 scripts/sync-config-dropdown.py
