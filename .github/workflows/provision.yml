name: Provision AWS Resources from YAML

on:
  push:
    branches: [ main ]
    paths:
      - 'configs/**.yaml'
      - 'configs/**.yml'

  workflow_dispatch:
    inputs:
      config_file:
        description: 'Path to a specific config YAML to (re)provision, e.g. configs/example-app.yaml'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # TEMPORARY: Debug the actual GitHub OIDC claims.
      # Do NOT print the complete JWT/token.
      - name: Debug OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log('===== GitHub OIDC Claims =====');
            console.log(JSON.stringify({
              iss: payload.iss,
              aud: payload.aud,
              sub: payload.sub,
              repository: payload.repository,
              repository_owner: payload.repository_owner,
              repository_id: payload.repository_id,
              repository_owner_id: payload.repository_owner_id,
              ref: payload.ref,
              event_name: payload.event_name
            }, null, 2));
            console.log('==============================');

      # Uses GitHub OIDC to assume an AWS IAM role.
      # No long-lived AWS keys are stored in GitHub.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Determine which config files to provision
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "files=${{ github.event.inputs.config_file }}" >> "$GITHUB_OUTPUT"
          else
            before="${{ github.event.before }}"

            if [ -z "$before" ] || \
               [ "$before" = "0000000000000000000000000000000000000000" ]; then
              files=$(git ls-files 'configs/*.yaml' 'configs/*.yml')
            else
              files=$(git diff --name-only \
                "$before" \
                "${{ github.sha }}" \
                -- \
                'configs/*.yaml' \
                'configs/*.yml')
            fi

            echo "files=$(echo "$files" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Provision resources for each changed config
        run: |
          chmod +x scripts/provision.sh

          for f in ${{ steps.changed.outputs.files }}; do
            [ -z "$f" ] && continue

            echo "::group::Provisioning from $f"
            ./scripts/provision.sh "$f"
            echo "::endgroup::"
          done
