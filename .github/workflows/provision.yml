name: Provision AWS Resources from YAML

concurrency:
  group: aws-provision-main
  cancel-in-progress: false

on:
  push:
    branches: [ main ]
    paths:
      - 'configs/**.yaml'
      - 'configs/**.yml'
      # A provisioning-code change must be applied to every managed config.
      - 'scripts/provision.sh'
      - '.github/workflows/provision.yml'
  workflow_dispatch:
    inputs:
      config_file:
        description: 'Path to a specific config YAML to (re)provision, e.g. configs/example-app.yaml'
        required: true

permissions:
  id-token: write   # required for OIDC -> AWS role assumption
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Uses GitHub OIDC to assume an AWS IAM role - no long-lived AWS keys
      # stored in GitHub. See README for the one-time bootstrap of this role.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Python (for YAML -> JSON parsing)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      # Older deployments granted iam:PutRolePolicy but omitted the S3 bucket
      # hardening actions. Repair only the role currently assumed by this job.
      - name: Ensure artifact-bucket permissions
        run: |
          caller_arn=$(aws sts get-caller-identity --query Arn --output text)
          role_name=${caller_arn#*:assumed-role/}
          role_name=${role_name%%/*}
          case "$caller_arn" in
            arn:*:sts::*:assumed-role/*/*) ;;
            *) echo "::error::Expected an assumed-role ARN, got: $caller_arn"; exit 1 ;;
          esac
          aws iam put-role-policy --role-name "$role_name" --policy-name provisioning-s3-artifacts --policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:CreateBucket","Resource":"*"},{"Effect":"Allow","Action":["s3:GetBucketAcl","s3:GetBucketLocation","s3:GetBucketVersioning","s3:ListBucket","s3:PutBucketEncryption","s3:PutBucketVersioning","s3:PutPublicAccessBlock"],"Resource":"arn:aws:s3:::*"}]}'

      - name: Determine which config files to provision
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CONFIG_FILE: ${{ inputs.config_file }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            config="$INPUT_CONFIG_FILE"
            case "$config" in
              configs/*.yaml|configs/*.yml) ;;
              *)
                echo "::error::config_file must point to configs/*.yaml or configs/*.yml"
                exit 1
                ;;
            esac
            if [ ! -f "$config" ]; then
              echo "::error::Config file not found: $config"
              exit 1
            fi
            echo "files=$config" >> "$GITHUB_OUTPUT"
          else
            # Diff against the previous commit on this push; fall back to
            # treating every config as new (first push / force-push cases).
            before="$BEFORE_SHA"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              files=$(git ls-files 'configs/*.yaml' 'configs/*.yml')
            elif ! git diff --quiet "$before" "$CURRENT_SHA" -- scripts/provision.sh .github/workflows/provision.yml; then
              # Reconcile every config when the provisioner itself changes.
              files=$(git ls-files 'configs/*.yaml' 'configs/*.yml')
            else
              # --diff-filter=d excludes deleted files - a deleted config
              # means "stop managing this," not "run provision.sh on a file
              # that no longer exists." (Deliberately not auto-running
              # deprovision.sh on a delete either: a file deletion isn't a
              # safe enough signal to automatically tear down real AWS
              # resources. Run scripts/deprovision.sh manually, or via the
              # separate Deprovision workflow, when you actually want that.)
              files=$(git diff --name-only --diff-filter=d "$before" "$CURRENT_SHA" -- 'configs/*.yaml' 'configs/*.yml')
            fi
            echo "files=$(echo "$files" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Provision resources for each changed config
        run: |
          chmod +x scripts/provision.sh
          for f in ${{ steps.changed.outputs.files }}; do
            [ -z "$f" ] && continue
            if [ ! -f "$f" ]; then
              echo "::warning::Skipping $f - file no longer exists (probably deleted in this push)."
              continue
            fi
            echo "::group::Provisioning from $f"
            ./scripts/provision.sh "$f"
            echo "::endgroup::"
          done