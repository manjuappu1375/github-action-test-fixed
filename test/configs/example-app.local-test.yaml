app_name: order-processor-test
aws_region: us-east-1

lambda:
  function_name: order-processor-fn
  runtime: python3.12
  handler: app.handler
  memory_size: 128
  timeout: 30
  source_dir: lambda-src

sqs:
  queue_name: order-processor-queue
  visibility_timeout: 60

# codebuild / codepipeline sections are still required by the parser but
# are skipped entirely when SKIP_CODE_SERVICES=true (LocalStack testing),
# so placeholder values are fine here.
codebuild:
  project_name: order-processor-build
  buildspec: buildspec.yml
  image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
  compute_type: BUILD_GENERAL1_SMALL

codepipeline:
  pipeline_name: order-processor-pipeline
  github_owner: your-github-org
  github_repo: your-repo-name
  github_branch: main
  connection_arn: ""
  artifact_bucket: order-processor-test-artifacts
