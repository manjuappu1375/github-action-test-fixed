app_name: order-processor
aws_region: us-east-1

lambda:
  function_name: order-processor-fn
  runtime: python3.12
  handler: app.handler
  memory_size: 128
  timeout: 30
  source_dir: lambda-src    
  

lambda:
  function_name: order-processor1
  runtime: python3.11
  handler: app.handler
  memory_size: 128
  timeout: 30
  source_dir: lambda-src     # folder in this repo zipped and deployed

sqs:
  queue_name: order-processor-queue
  visibility_timeout: 60

codebuild:
  project_name: order-processor-build
  buildspec: buildspec.yml
  image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
  compute_type: BUILD_GENERAL1_SMALL

codepipeline:
  pipeline_name: order-processor-pipeline
  github_owner: manjuappu1375
  github_repo: github-action-test-fixed
  github_branch: main
  # One-time manual step (see README): create + authorize a CodeStar Connection
  # in the AWS console, then paste its ARN here.
  connection_arn: "arn:aws:codeconnections:us-east-1:842675988954:connection/39b8586d-b53f-4861-923c-5c0da0c480aa"
  artifact_bucket: order-processor-pipeline-artifacts   # account id gets appended if omitted
