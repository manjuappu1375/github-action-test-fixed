app_name: order-processor3

aws_region: us-east-1

lambda:
  function_name: order-processor3-fn
  runtime: python3.12
  handler: app.handler
  memory_size: 128
  timeout: 30
  source_dir: lambda-src
  reconcile_existing: false
  environment:
    APP_NAME: order-processor3
  layer:
    managed: true
    name: order-processor3-deps
    source_dir: lambda-layer
    compatible_runtimes: [python3.12]
    description: "Shared dependencies for order-processor3"

sqs:
  queue_name: order-processor3-queue
  visibility_timeout: 60

codebuild:
  project_name: order-processor3-build
  buildspec: buildspec.yml
  image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
  compute_type: BUILD_GENERAL1_SMALL

codepipeline:
  pipeline_name: order-processor3-pipeline
  github_owner: manjuappu1375
  github_repo: github-action-test-fixed
  github_branch: main
  connection_arn: "arn:aws:codeconnections:us-east-1:842675988954:connection/39b8586d-b53f-4861-923c-5c0da0c480aa"
  artifact_bucket: order-processor3-pipeline-artifacts
