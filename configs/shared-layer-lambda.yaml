app_name: shared-layer-lambda
aws_region: us-east-1

lambda:
  function_name: shared-layer-lambda-fn
  runtime: python3.11
  handler: app.handler
  memory_size: 128
  timeout: 30
  source_dir: lambda-src
  reconcile_existing: false
  environment:
    APP_NAME: shared-layer-lambda
  layer:
    managed: false
    arn: arn:aws:lambda:us-east-1:842675988954:layer:testing-layer:2

sqs:
  queue_name: shared-layer-lambda-queue
  visibility_timeout: 60

codebuild:
  project_name: shared-layer-lambda-build
  buildspec: buildspec.yml
  image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
  compute_type: BUILD_GENERAL1_SMALL

codepipeline:
  pipeline_name: shared-layer-lambda-pipeline
  github_owner: manjuappu1375
  github_repo: github-action-test-fixed
  github_branch: main
  connection_arn: "arn:aws:codeconnections:us-east-1:842675988954:connection/39b8586d-b53f-4861-923c-5c0da0c480aa"
  artifact_bucket: shared-layer-lambda-pipeline-artifacts
